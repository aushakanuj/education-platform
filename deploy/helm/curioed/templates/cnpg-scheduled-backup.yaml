{{- if .Values.cnpg.backup.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "curioed.scheduledBackupName" . }}
  labels:
    {{- include "curioed.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.cnpg.backup.schedule | quote }}
  backupOwnerReference: self
  immediate: false
  cluster:
    name: {{ include "curioed.clusterName" . }}
  method: plugin
  pluginConfiguration:
    name: {{ .Values.cnpg.backup.plugin | quote }}
{{- end }}
