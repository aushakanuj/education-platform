suite: database wait and seed job shape
templates:
  - migrate-job.yaml
  - seed-job.yaml
set:
  api.image.tag: ci
  web.image.tag: ci
release:
  name: curioed
  namespace: curioed
  revision: 4
tests:
  - it: the seed has no hook annotations and its name contains the revision
    template: seed-job.yaml
    set:
      curriculumSeed.enabled: true
    asserts:
      - isNull:
          path: metadata.annotations
      - equal:
          path: metadata.name
          value: curioed-seed-r4
  - it: migrate keeps its hook
    template: migrate-job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
  - it: both have the wait-for-DB initContainer
    template: migrate-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/cloudnative-pg/postgresql:16.15-standard-trixie
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: pg_isready -h "\$\{POSTGRES_HOST\}" -p 5432
  - it: the seed job waits for the database too
    template: seed-job.yaml
    set:
      curriculumSeed.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/cloudnative-pg/postgresql:16.15-standard-trixie
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: false
