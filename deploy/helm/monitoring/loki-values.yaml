# Overlay for grafana/loki in single-binary mode.
# Filesystem storage. MinIO stays off so this file does not pick a provider.
# Install instructions are in README.md. Nothing in CI applies this file.

deploymentMode: SingleBinary

minio:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
