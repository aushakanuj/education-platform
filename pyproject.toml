[project]
name = "education-platform"
version = "0.1.0"
description = "Agentic education management and analytics backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "boto3>=1.37",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pgvector>=0.3",
  "pydantic-settings>=2.8",
  "pydantic[email]>=2.10",
  "pypdf>=5.3",
  "pyjwt[crypto]>=2.10",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21",
  "mypy>=1.15",
  "pre-commit>=4.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/education_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["education_platform"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["education_platform"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
